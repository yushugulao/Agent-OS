stages:
  - budget
  - reader
  - test

variables:
  DEBIAN_FRONTEND: noninteractive
  TOOLPREFIX: riscv64-linux-gnu-

.agentos-toolchain:
  image: ubuntu:26.04
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      build-essential make python3 git
      gcc-riscv64-linux-gnu=4:15.2.0-5ubuntu1
      gcc-15-riscv64-linux-gnu=15.2.0-16ubuntu1cross1
      cpp-15-riscv64-linux-gnu=15.2.0-16ubuntu1cross1
      libgcc-15-dev-riscv64-cross=15.2.0-16ubuntu1cross1
      binutils-riscv64-linux-gnu=2.46-3ubuntu2
      qemu-system-riscv=1:10.2.1+ds-1ubuntu3
      opensbi=1.8.1-1

kernel-budgets:
  extends: .agentos-toolchain
  stage: budget
  tags:
    - agentos-host-calibrated
  timeout: 20m
  script:
    - mkdir -p ci-artifacts
    - bash -o pipefail -c 'bash scripts/verify-dual-target-structure.sh 2>&1 | tee ci-artifacts/kernel-budgets.log'
    - bash -o pipefail -c 'make ci-check 2>&1 | tee -a ci-artifacts/kernel-budgets.log'
    - bash -o pipefail -c 'python3 host_tools/test_plain_ucore_action_runner.py 2>&1 | tee -a ci-artifacts/kernel-budgets.log'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/kernel-budgets.log

reader-e2e:
  extends: .agentos-toolchain
  stage: reader
  tags:
    - agentos-qemu-calibrated
  resource_group: agentos-qemu-performance
  dependencies: []
  timeout: 15m
  script:
    - mkdir -p ci-artifacts
    - >-
      bash -o pipefail -c '
      env QEMU=qemu-system-riscv64 PYTHONUNBUFFERED=1
      PLAIN_UCORE_READER_E2E_LOG_DIR=ci-artifacts/reader-e2e-raw
      python3 host_tools/test_plain_ucore_reader_e2e.py 2>&1 |
      tee ci-artifacts/reader-e2e.log'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/reader-e2e.log
      - ci-artifacts/reader-e2e-raw/

agent-regression:
  extends: .agentos-toolchain
  stage: test
  tags:
    - agentos-qemu-calibrated
  resource_group: agentos-qemu-performance
  dependencies: []
  timeout: 15m
  script:
    - mkdir -p ci-artifacts
    - ': > ci-artifacts/agent-suite-timings.log'
    - ': > ci-artifacts/agent-suite-guest.log'
    - >-
      bash -o pipefail -c '
      env -u AGENT_TEST_CASE
      REQUIRE_FULL_SUITE=1
      AGENT_TEST_CALIBRATE=0
      AGENT_TEST_TIMING_FILE=ci-artifacts/agent-suite-timings.log
      AGENT_TEST_GUEST_LOG_FILE=ci-artifacts/agent-suite-guest.log
      TOOLPREFIX=riscv64-linux-gnu-
      LOG=error
      CHAPTER=agent
      QEMU=qemu-system-riscv64
      PYTHON_BIN=python3
      CASE_TIMEOUT=300s
      IDLE_NOTICE_SECONDS=20
      MARKER_GRACE_SECONDS=2s
      bash scripts/run-agent-tests.sh 2>&1 |
      tee ci-artifacts/agent-regression-job.log'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/agent-suite-timings.log
      - ci-artifacts/agent-suite-guest.log
      - ci-artifacts/agent-regression-job.log

kernel-mechanism-regression:
  extends: .agentos-toolchain
  stage: test
  tags:
    - agentos-qemu-calibrated
  resource_group: agentos-qemu-performance
  dependencies: []
  timeout: 35m
  variables:
    MARKER_GRACE_SECONDS: 5s
  script:
    - mkdir -p ci-artifacts
    - 'for label in proc-reap syscall-fairness file-resource thread-resource workflow-teardown-race fs-enospc; do : > "ci-artifacts/${label}-guest.log"; done'
    - >-
      bash -o pipefail -c '
      env TOOLPREFIX=riscv64-linux-gnu- QEMU=qemu-system-riscv64
      CASE_TIMEOUT=300s MARKER_GRACE_SECONDS=5s
      EVIDENCE_GUEST_LOG_FILE=ci-artifacts/proc-reap-guest.log
      bash scripts/run-proc-reap-tests.sh 2>&1 |
      tee ci-artifacts/proc-reap-job.log'
    - >-
      bash -o pipefail -c '
      env TOOLPREFIX=riscv64-linux-gnu- QEMU=qemu-system-riscv64
      CASE_TIMEOUT=300s MARKER_GRACE_SECONDS=5s
      EVIDENCE_GUEST_LOG_FILE=ci-artifacts/syscall-fairness-guest.log
      bash scripts/run-syscall-fairness-tests.sh 2>&1 |
      tee ci-artifacts/syscall-fairness-job.log'
    - >-
      bash -o pipefail -c '
      env TOOLPREFIX=riscv64-linux-gnu- QEMU=qemu-system-riscv64
      CASE_TIMEOUT=300s MARKER_GRACE_SECONDS=5s
      EVIDENCE_GUEST_LOG_FILE=ci-artifacts/file-resource-guest.log
      bash scripts/run-file-resource-tests.sh 2>&1 |
      tee ci-artifacts/file-resource-job.log'
    - >-
      bash -o pipefail -c '
      env TOOLPREFIX=riscv64-linux-gnu- QEMU=qemu-system-riscv64
      CASE_TIMEOUT=300s MARKER_GRACE_SECONDS=5s
      EVIDENCE_GUEST_LOG_FILE=ci-artifacts/thread-resource-guest.log
      bash scripts/run-thread-resource-tests.sh 2>&1 |
      tee ci-artifacts/thread-resource-job.log'
    - >-
      bash -o pipefail -c '
      env TOOLPREFIX=riscv64-linux-gnu-
      QEMU=qemu-system-riscv64
      CASE_TIMEOUT=300s
      MARKER_GRACE_SECONDS=5s
      EVIDENCE_GUEST_LOG_FILE=ci-artifacts/workflow-teardown-race-guest.log
      WORKFLOW_TEARDOWN_LOG_DIR=ci-artifacts/workflow-teardown-race
      WORKFLOW_TEARDOWN_STABILITY_RUNS=3
      bash scripts/run-workflow-teardown-race-tests.sh 2>&1 |
      tee ci-artifacts/workflow-teardown-race-job.log'
    - >-
      bash -o pipefail -c '
      env TOOLPREFIX=riscv64-linux-gnu- QEMU=qemu-system-riscv64
      CASE_TIMEOUT=300s MARKER_GRACE_SECONDS=5s
      EVIDENCE_GUEST_LOG_FILE=ci-artifacts/fs-enospc-guest.log
      bash scripts/run-fs-enospc-tests.sh 2>&1 |
      tee ci-artifacts/fs-enospc-job.log'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/*-guest.log
      - ci-artifacts/*-job.log
      - ci-artifacts/workflow-teardown-race/
