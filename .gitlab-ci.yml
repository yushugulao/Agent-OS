stages:
  - budget
  - reader
  - test

variables:
  DEBIAN_FRONTEND: noninteractive
  TOOLPREFIX: riscv64-linux-gnu-

.agentos-toolchain:
  image: ubuntu:26.04
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      build-essential make python3 git
      gcc-riscv64-linux-gnu=4:15.2.0-5ubuntu1
      gcc-15-riscv64-linux-gnu=15.2.0-16ubuntu1cross1
      cpp-15-riscv64-linux-gnu=15.2.0-16ubuntu1cross1
      libgcc-15-dev-riscv64-cross=15.2.0-16ubuntu1cross1
      binutils-riscv64-linux-gnu=2.46-3ubuntu2
      qemu-system-riscv=1:10.2.1+ds-1ubuntu3
      opensbi=1.8.1-1

kernel-budgets:
  extends: .agentos-toolchain
  stage: budget
  tags:
    - agentos-host-calibrated
  timeout: 20m
  script:
    - mkdir -p ci-artifacts
    - bash -o pipefail -c 'bash scripts/verify-dual-target-structure.sh 2>&1 | tee ci-artifacts/kernel-budgets.log'
    - bash -o pipefail -c 'make ci-check 2>&1 | tee -a ci-artifacts/kernel-budgets.log'
    - python3 host_tools/remote_ci_evidence.py attest --job kernel-budgets --artifact-root ci-artifacts
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/kernel-budgets.log
      - ci-artifacts/remote-ci-attestation.json

reader-e2e:
  extends: .agentos-toolchain
  stage: reader
  tags:
    - agentos-qemu-calibrated
  resource_group: agentos-qemu-performance
  dependencies: []
  timeout: 15m
  script:
    - mkdir -p ci-artifacts
    - >-
      bash -o pipefail -c '
      env QEMU=qemu-system-riscv64 PYTHONUNBUFFERED=1
      PLAIN_UCORE_READER_E2E_LOG_DIR=ci-artifacts/reader-e2e-raw
      python3 host_tools/test_plain_ucore_reader_e2e.py 2>&1 |
      tee ci-artifacts/reader-e2e.log'
    - python3 host_tools/remote_ci_evidence.py attest --job reader-e2e --artifact-root ci-artifacts
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/reader-e2e.log
      - ci-artifacts/reader-e2e-raw/
      - ci-artifacts/remote-ci-attestation.json

agent-regression:
  extends: .agentos-toolchain
  stage: test
  tags:
    - agentos-qemu-calibrated
  resource_group: agentos-qemu-performance
  dependencies: []
  timeout: 15m
  script:
    - mkdir -p ci-artifacts
    - ': > ci-artifacts/agent-suite-timings.log'
    - ': > ci-artifacts/agent-suite-guest.log'
    - >-
      bash -o pipefail -c '
      env -u AGENT_TEST_CASE
      REQUIRE_FULL_SUITE=1
      AGENT_TEST_CALIBRATE=0
      AGENT_TEST_TIMING_FILE=ci-artifacts/agent-suite-timings.log
      AGENT_TEST_GUEST_LOG_FILE=ci-artifacts/agent-suite-guest.log
      TOOLPREFIX=riscv64-linux-gnu-
      LOG=error
      CHAPTER=agent
      QEMU=qemu-system-riscv64
      PYTHON_BIN=python3
      CASE_TIMEOUT=300s
      IDLE_NOTICE_SECONDS=20
      MARKER_GRACE_SECONDS=2s
      bash scripts/run-agent-tests.sh 2>&1 |
      tee ci-artifacts/agent-regression-job.log'
    - python3 host_tools/remote_ci_evidence.py attest --job agent-regression --artifact-root ci-artifacts
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/agent-suite-timings.log
      - ci-artifacts/agent-suite-guest.log
      - ci-artifacts/agent-regression-job.log
      - ci-artifacts/remote-ci-attestation.json

.agentos-mechanism:
  extends: .agentos-toolchain
  stage: test
  tags:
    - agentos-qemu-calibrated
  resource_group: agentos-qemu-performance
  dependencies: []
  variables:
    QEMU: qemu-system-riscv64
    PYTHON_BIN: python3
    CASE_TIMEOUT: 300s
    IDLE_NOTICE_SECONDS: 20s
    MARKER_GRACE_SECONDS: 5s
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/

kernel-mechanism-regression:
  extends: .agentos-mechanism
  timeout: 35m
  script:
    - bash scripts/run-ci-mechanism.sh proc-reap scripts/run-proc-reap-tests.sh
    - bash scripts/run-ci-mechanism.sh syscall-fairness scripts/run-syscall-fairness-tests.sh
    - bash scripts/run-ci-mechanism.sh file-resource scripts/run-file-resource-tests.sh
    - bash scripts/run-ci-mechanism.sh thread-resource scripts/run-thread-resource-tests.sh
    - >-
      WORKFLOW_TEARDOWN_LOG_DIR=${CI_PROJECT_DIR}/.workflow-teardown-race
      WORKFLOW_TEARDOWN_STABILITY_RUNS=3
      bash scripts/run-ci-mechanism.sh workflow-teardown-race
      scripts/run-workflow-teardown-race-tests.sh
    - bash scripts/run-ci-mechanism.sh fs-enospc scripts/run-fs-enospc-tests.sh
    - python3 host_tools/remote_ci_evidence.py attest --job kernel-mechanism-regression --artifact-root ci-artifacts

physical-resource-regression:
  extends: .agentos-mechanism
  timeout: 20m
  script:
    - bash scripts/run-ci-mechanism.sh physical-resource scripts/run-physical-resource-tests.sh
    - python3 host_tools/remote_ci_evidence.py attest --job physical-resource-regression --artifact-root ci-artifacts

metadata-recovery-regression:
  extends: .agentos-mechanism
  timeout: 60m
  script:
    - bash scripts/run-ci-mechanism.sh metadata-recovery scripts/run-metadata-recovery-tests.sh
    - python3 host_tools/remote_ci_evidence.py attest --job metadata-recovery-regression --artifact-root ci-artifacts

observe-recovery-regression:
  extends: .agentos-mechanism
  timeout: 25m
  script:
    - >-
      OBSERVE_RECOVERY_SNAPSHOT_FILE=ci-artifacts/observe-recovery-before-reap.img
      bash scripts/run-ci-mechanism.sh observe-recovery
      scripts/run-observe-recovery-tests.sh
    - python3 host_tools/remote_ci_evidence.py attest --job observe-recovery-regression --artifact-root ci-artifacts

virtio-disk-regression:
  extends: .agentos-mechanism
  timeout: 20m
  script:
    - bash scripts/run-ci-mechanism.sh virtio-disk scripts/run-virtio-disk-tests.sh
    - python3 host_tools/remote_ci_evidence.py attest --job virtio-disk-regression --artifact-root ci-artifacts

fs-allocator-fault-regression:
  extends: .agentos-mechanism
  timeout: 45m
  script:
    - >-
      FS_ALLOCATOR_ARTIFACT_DIR=${CI_PROJECT_DIR}/.fs-allocator-evidence
      FS_ALLOCATOR_EVIDENCE_ARCHIVE=${CI_PROJECT_DIR}/ci-artifacts/fs-allocator-evidence.tar
      bash scripts/run-ci-mechanism.sh fs-allocator-fault
      scripts/run-fs-allocator-fault-tests.sh
    - python3 scripts/fs-allocator-evidence.py verify-archive --archive "${CI_PROJECT_DIR}/ci-artifacts/fs-allocator-evidence.tar"
    - python3 host_tools/remote_ci_evidence.py attest --job fs-allocator-fault-regression --artifact-root ci-artifacts
