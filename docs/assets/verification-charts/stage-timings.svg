<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520">
<style>
text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#1f2937}
.title{font-size:20px;font-weight:700}.subtitle{font-size:13px;fill:#52616f}
.axis{font-size:12px;fill:#52616f}.label{font-size:12px}.value{font-size:12px;font-weight:700}
</style>
<rect width="1040" height="520" fill="#ffffff"/>
<text x="34" y="34" class="title">双目标运行阶段耗时</text>
<text x="34" y="58" class="subtitle">用于定位构建、QEMU 运行、镜像提取、Reader 渲染或结果对照中的异常停顿。</text>
<text x="226" y="101.0" text-anchor="end" class="label">结构检查</text>
<rect x="240" y="80.0" width="45.0" height="30.0" fill="#f58518" rx="2"/>
<text x="293.0" y="101.0" class="value">1s</text>
<text x="226" y="141.0" text-anchor="end" class="label">预置请求双目标运行</text>
<rect x="240" y="120.0" width="720.0" height="30.0" fill="#f58518" rx="2"/>
<text x="968.0" y="141.0" class="value">16s</text>
<text x="226" y="181.0" text-anchor="end" class="label">状态文件结果对照</text>
<rect x="240" y="160.0" width="135.0" height="30.0" fill="#f58518" rx="2"/>
<text x="383.0" y="181.0" class="value">3s</text>
<text x="226" y="221.0" text-anchor="end" class="label">Reader页面渲染与检查</text>
<rect x="240" y="200.0" width="135.0" height="30.0" fill="#f58518" rx="2"/>
<text x="383.0" y="221.0" class="value">3s</text>
<text x="226" y="261.0" text-anchor="end" class="label">结果报告与图表生成</text>
<rect x="240" y="240.0" width="45.0" height="30.0" fill="#f58518" rx="2"/>
<text x="293.0" y="261.0" class="value">1s</text>
</svg>
