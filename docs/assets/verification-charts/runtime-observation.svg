<text x="599.0" y="164" text-anchor="middle" class="axis">3s</text>
<rect x="693.6" y="108" width="165.2" height="22" fill="#54a24b" rx="2"/>
<text x="776.2" y="124" text-anchor="middle" class="label" fill="#fff">ready</text>
<text x="776.2" y="146" text-anchor="middle" class="axis">Reader页面</text>
<text x="776.2" y="164" text-anchor="middle" class="axis">3s</text>
<rect x="870.8" y="108" width="165.2" height="22" fill="#54a24b" rx="2"/>
<text x="953.4" y="124" text-anchor="middle" class="label" fill="#fff">ready</text>
