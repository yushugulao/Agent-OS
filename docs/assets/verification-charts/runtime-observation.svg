<text x="953.4" y="164" text-anchor="middle" class="axis">1s</text>
<rect x="42" y="202" width="330" height="128" fill="#ffffff" stroke="#d8dee6"/>
<rect x="42" y="202" width="6" height="128" fill="#54a24b"/>
