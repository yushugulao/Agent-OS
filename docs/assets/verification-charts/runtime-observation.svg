<text x="766" y="418" class="axis">第一步</text>
<text x="1000" y="418" text-anchor="end" class="value">看运行结果</text>
<text x="766" y="438" class="axis">第二步</text>
<text x="1000" y="438" text-anchor="end" class="value">看内核证据</text>
<text x="766" y="458" class="axis">第三步</text>
<text x="1000" y="458" text-anchor="end" class="value">打开Reader页面</text>
