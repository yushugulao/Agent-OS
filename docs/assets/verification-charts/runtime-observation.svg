<text x="60" y="254" class="axis">结果可对照</text>
<text x="294" y="254" text-anchor="end" class="value">是</text>
<text x="60" y="274" class="axis">成功记录核对</text>
<text x="294" y="274" text-anchor="end" class="value">1244</text>
