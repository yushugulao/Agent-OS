<text x="294" y="294" text-anchor="end" class="value">44</text>
<rect x="395" y="202" width="330" height="128" fill="#ffffff" stroke="#d8dee6"/>
<rect x="395" y="202" width="6" height="128" fill="#4c78a8"/>
