<text x="294" y="458" text-anchor="end" class="value">61</text>
<rect x="395" y="366" width="330" height="128" fill="#ffffff" stroke="#d8dee6"/>
<rect x="395" y="366" width="6" height="128" fill="#6f7f8f"/>
