<text x="1000" y="478" text-anchor="end" class="value">查看日志定位异常</text>
<text x="42" y="552" class="subtitle">读图方法：先确认运行结果和 QEMU 健康，再看 AgentOS 多出的状态、API、Agent 启动与内核事实；异常时回到</text>
<text x="42" y="574" class="subtitle">stage-timings.csv 和 ucore-run.log。</text>
</svg>
