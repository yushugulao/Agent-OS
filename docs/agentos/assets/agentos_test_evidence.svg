      .small { font: 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .tiny { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #374151; }
      .box { stroke: #111827; stroke-width: 2.1; rx: 8; ry: 8; }
      .arrow { stroke: #111827; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="680" fill="#ffffff"/>
  <text x="45" y="48" class="title">AgentOS-uCore 测试证据组织方式</text>
  <rect x="55" y="95" width="210" height="92" fill="#ffe08a" class="box"/>
