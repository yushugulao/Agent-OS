  <text x="930" y="162" class="tiny">父进程通过</text>
  <path d="M265 141 L330 141" class="arrow"/>
  <path d="M560 141 L635 141" class="arrow"/>
  <path d="M865 141 L910 141" class="arrow"/>
  <rect x="80" y="285" width="960" height="280" fill="#f8fafc" class="box"/>
  <text x="110" y="326" class="label">从测试输出提取到文档的证据</text>
  <rect x="120" y="360" width="180" height="115" fill="#ffffff" class="box"/>
  <text x="150" y="394" class="small">功能条目</text>
  <text x="143" y="424" class="tiny">任务到测试的对应</text>
  <text x="143" y="448" class="tiny">系统调用和文件链接</text>
